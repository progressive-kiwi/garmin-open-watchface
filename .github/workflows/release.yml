name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or update (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache SDK and device definitions
        uses: actions/cache@v4
        with:
          path: |
            ~/.ciq
            ~/.Garmin/ConnectIQ/Devices
          key: ciq-${{ runner.os }}-v1

      - name: Set up Connect IQ SDK
        run: echo "SDK=$(tools/setup_sdk.sh | tail -n1)" >> "$GITHUB_ENV"

      - name: Developer key
        env:
          CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
        run: |
          if [ -n "$CIQ_DEVELOPER_KEY" ]; then
            echo "$CIQ_DEVELOPER_KEY" | base64 -d > developer_key.der
          else
            echo "::warning::CIQ_DEVELOPER_KEY not set; signing with an ephemeral key (fine for side-loading, not for store updates)."
            openssl genrsa -out key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
          fi

      - name: Build
        run: tools/build.sh "$SDK" developer_key.der build all

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="Side-load: unzip OpenFace-prg.zip and copy OpenFace-<device>.prg to GARMIN/APPS on the watch.
          Store package: OpenFace.iq.
          Docs: https://progressive-kiwi.github.io/open-garmin-watchface/"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/OpenFace.iq build/OpenFace-prg.zip --clobber
          else
            gh release create "$TAG" build/OpenFace.iq build/OpenFace-prg.zip \
              --title "Open Face $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
