name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 22.04 still ships webkit2gtk-4.0, which the Connect IQ simulator links against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb imagemagick libsecret-1-0 \
            libwebkit2gtk-4.0-37 libsoup2.4-1 fonts-roboto-unhinted fonts-nanum fonts-noto-core

      - name: Cache SDK and device definitions
        uses: actions/cache@v4
        with:
          path: |
            ~/.ciq
            ~/.Garmin/ConnectIQ/Devices
          key: ciq-${{ runner.os }}-v1

      - name: Set up Connect IQ SDK
        run: echo "SDK=$(tools/setup_sdk.sh | tail -n1)" >> "$GITHUB_ENV"

      - name: Screenshots
        # The committed images stay in place if the simulator misbehaves on the runner.
        continue-on-error: true
        run: |
          openssl genrsa -out key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
          python3 tools/screenshots.py --sdk "$SDK" --key developer_key.der --out docs/images

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render docs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
